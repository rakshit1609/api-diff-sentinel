[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-diff-sentinel"
version = "1.0.1"
description = "Fast, automated OpenAPI & REST API breaking change detector and semantic changelog generator."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["cli","developer-tools"]

[project.scripts]
api-diff = "api_diff_sentinel.cli:main"

[tool.setuptools]
packages = ["api_diff_sentinel"]
